<h1 style="position:fixed;top:0;left:0;z-index:999999;
background:black;color:white;padding:10px;">
🔥 ESTE ES EL ARCHIVO ACTIVO
</h1>


<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Visor Electoral Chiapas</title>

    <!-- Si usas Leaflet (mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<!-- 🖼️ MAPA -->
<div id="map"></div>

<!-- ⏳ CONTADOR -->
<div id="contador" style="
position:fixed;
top:10px;
right:10px;
background:white;
padding:10px;
border-radius:8px;
z-index:9999;
font-size:14px;
box-shadow:0 0 5px gray;
">
⏳ Tiempo: 3:00
</div>

<!-- 🔒 LOGOUT AUTOMÁTICO -->
<script>

let tiempo = 180;

function actualizar() {

    let min = Math.floor(tiempo / 60);
    let sec = tiempo % 60;

    document.getElementById("contador").innerHTML =
        "⏳ Tiempo: " + min + ":" + (sec < 10 ? "0" : "") + sec;

    if (tiempo <= 0) {
        alert("Sesión expirada");
        window.location.href = "/logout";
    }

    tiempo--;
}

setInterval(actualizar, 1000);

</script>

<!-- 🗺️ LEAFLET MAPA (BASE) -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// 📍 CENTRO DEL MAPA (CHIAPAS)
var map = L.map('map').setView([16.75, -93.13], 8);

// 🌍 BASE MAPA
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'Mapa Electoral Chiapas'
}).addTo(map);

// 📦 GEOJSON
fetch('/geojson/secciones')
    .then(res => res.json())
    .then(data => {

        L.geoJSON(data, {
            style: function(feature) {
                return {
                    color: "#3388ff",
                    weight: 1,
                    fillOpacity: 0.4
                };
            },
            onEachFeature: function(feature, layer) {

                layer.bindPopup(
                    "<b>Municipio:</b> " + (feature.properties.MUNICIPIO || "N/A") +
                    "<br><b>Sección:</b> " + (feature.properties.SECCION || "N/A") +
                    "<br><b>Votación:</b> " + (feature.properties.VOTACION_TOTAL || "N/A") +
                    "<br><b>Ganador:</b> " + (feature.properties.PARTIDO_GANADOR || "N/A")
                );
            }
        }).addTo(map);

    });

</script>

</body>
</html>
